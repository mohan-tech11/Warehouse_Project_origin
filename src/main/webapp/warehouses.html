<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Warehouses - WarehousePro</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">

    <div class="logo">

        <div class="logo-icon">📦</div>

        <span>
            Warehouse<span class="blue">Pro</span>
        </span>

    </div>


    <nav>

        <a href="warehouse.html">Home</a>

        <a href="products.html">Products</a>

        <a href="orders.html">Orders</a>

        <a href="inventory.html">Inventory</a>

        <a href="customers.html">Customers</a>

        <a href="warehouses.html" class="active">
            Warehouses
        </a>

        <a href="dispatch.html">Dispatch</a>

    </nav>


    <a href="login.html" class="login-btn">
       👤 logout
    </a>

</header>



<main class="page">


    <div class="page-header">

        <div>

            <h1>Warehouses</h1>

            <p>
                Manage warehouse locations.
            </p>

        </div>


        <button
            class="primary-btn"
            onclick="showForm('warehouseForm')">

            + Add Warehouse

        </button>

    </div>



    <div
        class="form-box hidden"
        id="warehouseForm">

        <h2 id="warehouseFormTitle">Add Warehouse</h2>


<form id="warehouseFormElement" onsubmit="saveWarehouse(event)">

<input type="hidden" name="warehouseId" id="warehouseId">

<input
    type="text"
    name="warehouseName"
    id="warehouseName"
    placeholder="Warehouse Name"
    required
>

<input
    type="text"
    name="location"
    id="warehouseLocation"
    placeholder="Location"
    required
>

<input
    type="number"
    name="capacity"
    id="warehouseCapacity"
    placeholder="Capacity"
    aria-label="Capacity"
    min="0"
    step="1"
    required
>

<button class="primary-btn" type="submit">
    <span id="warehouseSaveButtonText">Save Warehouse</span>
</button>

<button
    type="button"
    class="cancel-btn"
    onclick="closeWarehouseForm()">
    Cancel
</button>


</form>


    </div>



    <div class="table-box">

        <h2>Warehouse List</h2>

        <label for="warehouseSearch">Search warehouses</label>
        <input
            type="search"
            id="warehouseSearch"
            placeholder="Search by warehouse ID, name, location, or capacity"
            oninput="filterWarehouses(this.value)"
        >


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Location</th>

                    <th>Capacity</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="warehouseTable">

                <tr>

                    <td colspan="5">
                        Loading warehouses...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</main>


<script src="app.js"></script>

<script>
    loadWarehouses();
</script>


</body>

</html>
